<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FinPilot REST API</title>

    <link rel="stylesheet"
          href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css">

    <style>
        body {
            margin: 0;
            background: #f5f7fa;
        }

        .swagger-ui .topbar {
            background-color: #166534;
        }
    </style>
</head>
<body>

<div id="swagger-ui"></div>

<script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>

<script>
    const secured = [{bearerAuth: []}];

    const idParameter = {
        name: "id",
        in: "path",
        required: true,
        schema: {type: "integer"}
    };

    function responses(code) {
        return {
            [code]: {description: "Success"},
            401: {description: "Unauthorized"},
            403: {description: "Forbidden"},
            404: {description: "Not found"},
            422: {description: "Validation error"},
            429: {description: "Too many requests"}
        };
    }

    function body(schema, example) {
        return {
            required: true,
            content: {
                "application/json": {
                    schema: schema,
                    example: example
                }
            }
        };
    }

    const transactionSchema = {
        type: "object",
        required: [
            "category_id",
            "type",
            "amount",
            "transaction_date"
        ],
        properties: {
            category_id: {type: "integer"},
            type: {
                type: "string",
                enum: ["income", "expense"]
            },
            amount: {
                type: "number",
                minimum: 0.01,
                maximum: 9999999999.99
            },
            description: {
                type: "string",
                nullable: true
            },
            transaction_date: {
                type: "string",
                format: "date"
            }
        }
    };

    const transactionExample = {
        category_id: 1,
        type: "income",
        amount: 150000,
        description: "Жалақы",
        transaction_date: "2026-11-27"
    };

    const spec = {
        openapi: "3.0.3",

        info: {
            title: "FinPilot REST API",
            version: "0.0-design",
            description:
                "Team 2 — Жеке қаржыны басқару жүйесі. Design Review."
        },

        servers: [
            {url: "/api"}
        ],

        components: {
            securitySchemes: {
                bearerAuth: {
                    type: "http",
                    scheme: "bearer"
                }
            }
        },

        paths: {
            "/register": {
                post: {
                    tags: ["Authentication"],
                    summary: "Пайдаланушыны тіркеу",
                    requestBody: body({
                        type: "object",
                        required: ["name", "email", "password"],
                        properties: {
                            name: {type: "string"},
                            email: {type: "string", format: "email"},
                            password: {type: "string", minLength: 8}
                        }
                    }, {
                        name: "Demo User",
                        email: "demo@example.com",
                        password: "DemoPass2026!"
                    }),
                    responses: responses("201")
                }
            },

            "/login": {
                post: {
                    tags: ["Authentication"],
                    summary: "Жүйеге кіру",
                    requestBody: body({
                        type: "object",
                        required: ["email", "password"],
                        properties: {
                            email: {type: "string"},
                            password: {type: "string"}
                        }
                    }, {
                        email: "demo@example.com",
                        password: "DemoPass2026!"
                    }),
                    responses: responses("200")
                }
            },

            "/logout": {
                post: {
                    tags: ["Authentication"],
                    summary: "Жүйеден шығу",
                    security: secured,
                    responses: responses("200")
                }
            },

            "/categories": {
                get: {
                    tags: ["Categories"],
                    summary: "Санаттар тізімін алу",
                    security: secured,
                    responses: responses("200")
                }
            },

            "/transactions": {
                get: {
                    tags: ["Transactions"],
                    summary: "Барлық транзакцияларды алу",
                    security: secured,
                    responses: responses("200")
                },

                post: {
                    tags: ["Transactions"],
                    summary: "Жаңа транзакция қосу",
                    security: secured,
                    requestBody: body(
                        transactionSchema,
                        transactionExample
                    ),
                    responses: responses("201")
                }
            },

            "/transactions/{id}": {
                parameters: [idParameter],

                get: {
                    tags: ["Transactions"],
                    summary: "Бір транзакцияны алу",
                    security: secured,
                    responses: responses("200")
                },

                put: {
                    tags: ["Transactions"],
                    summary: "Транзакцияны өзгерту",
                    security: secured,
                    requestBody: body(
                        transactionSchema,
                        transactionExample
                    ),
                    responses: responses("200")
                },

                delete: {
                    tags: ["Transactions"],
                    summary: "Транзакцияны жою",
                    security: secured,
                    responses: responses("204")
                }
            },

            "/admin/users": {
                get: {
                    tags: ["Admin"],
                    summary: "Пайдаланушылар тізімі — тек Admin",
                    security: secured,
                    responses: responses("200")
                }
            }
        }
    };

    SwaggerUIBundle({
        spec: spec,
        dom_id: "#swagger-ui",
        deepLinking: true,
        requestInterceptor: function (request) {
            request.headers["Accept"] = "application/json";
            return request;
        }
    });
</script>

</body>
</html>

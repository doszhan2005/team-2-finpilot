services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finpilot-backend
    ports:
      - "127.0.0.1:8000:80"
    environment:
      APP_NAME: FinPilot
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY:-}
      LOG_CHANNEL: stderr
      LOG_STDERR_FORMATTER: 'Monolog\Formatter\JsonFormatter'
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: finpilot
      DB_USERNAME: finpilot
      DB_PASSWORD: ${DB_PASSWORD:-finpilot_local}
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  db:
    image: mysql:8.4
    container_name: finpilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: finpilot
      MYSQL_USER: finpilot
      MYSQL_PASSWORD: ${DB_PASSWORD:-finpilot_local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
  app_storage:
